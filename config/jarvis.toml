# =============================================================================
# CONFIGURACION PRINCIPAL DEL PROYECTO JARVIS
# =============================================================================
# Este archivo se relee solo. Cambiar un valor aqui se refleja en el nucleo sin
# reiniciar nada. Si lo dejas mal escrito, Jarvis conserva la configuracion
# anterior y avisa en el registro en vez de caerse.
#
# Jerarquia: valores por defecto  ->  este archivo  ->  variables de entorno.
# Para sobreescribir sin tocar el archivo:  JARVIS_VOICE__WAKE_THRESHOLD=0.7
#
# Los valores de aqui son los defaults documentados en core/jarvis/config.py.
# Solo hace falta escribir lo que quieras cambiar.
# =============================================================================

user_name = "Rhandy"
log_level = "INFO"
development = true
log_file = "logs/jarvis.log"
# El registro no esta cifrado: por defecto guarda la longitud de lo que dices,
# no el contenido. Activalo solo para depurar.
log_user_content = false

# -----------------------------------------------------------------------------
# VOZ
# -----------------------------------------------------------------------------
[voice]
# input_device = "Microfono (Realtek)"   # None usa el dispositivo por defecto
# output_device = "Auriculares"          # None usa la salida por defecto
# NOTA: en esta maquina Windows no tiene microfono predeterminado. Jarvis usa
# el primero que encuentre (el conector Realtek por WDM-KS) y lo avisa en el
# registro. Para elegir otro, pon aqui parte de su nombre.
sample_rate = 16000
frame_ms = 32                 # 512 muestras: el bloque de Silero, ~30 Hz de nivel
ring_buffer_seconds = 3.0
models_dir = "models"         # bajalos con: python scripts/download_voice_models.py

wake_word = "jarvis"
wake_engine = "openwakeword"
# El catalogo de openWakeWord trae "hey_jarvis", entrenado con voces en ingles:
# responde a "Jarvis" pronunciado a la inglesa ("DYAR-vis"), no con jota.
# Un modelo propio se apunta con su ruta: wake_model = "models/jarvis_es.onnx"
wake_model = "hey_jarvis"
wake_threshold = 0.5          # subelo si hay falsos positivos, bajalo si no dispara
wake_cooldown_s = 1.5
wake_preroll_ms = 500         # audio previo al disparo que se conserva

vad_engine = "silero"         # silero | energy
vad_threshold = 0.5
vad_min_speech_ms = 150
vad_silence_ms = 700          # silencio que marca el fin de una frase
speech_start_timeout_s = 5.0  # "Jarvis" y silencio: se cierra con texto vacio
max_listen_s = 30.0
publish_idle_level = false    # sin palabra clave no sale nada, ni el nivel

stt_engine = "local"
# ESTA MAQUINA NO TIENE GPU DEDICADA (i5-10500, Intel UHD 630, 16GB RAM).
# Medido con scripts/voice_bench.py: small ~2.5 s por frase, base ~0.85 s,
# tiny ~0.4 s pero con errores. Con GPU dedicada, subir a "large-v3-turbo".
stt_model = "base"
stt_device = "cpu"
stt_compute_type = "int8"
stt_beam_size = 1
# "auto" triplica la latencia en CPU: detectar el idioma cuesta otra pasada.
stt_language = "es"
stt_prompt = "Jarvis, sube el volumen. Baja el brillo. Abre el navegador. Pon musica en Spotify."
# Las parciales compiten por la CPU con la transcripcion final: con base en
# este procesador retrasarian la final hasta ~0.8 s. Apagadas aqui.
stt_partials = false
stt_partial_interval_ms = 700

tts_engine = "local"
tts_voice = "es_MX-claude-high"
tts_amplitude_hz = 60
barge_in_enabled = true

# -----------------------------------------------------------------------------
# COGNICION -- la cascada de tres niveles
# -----------------------------------------------------------------------------
[cognition]
privacy_mode = "HYBRID"       # HYBRID | LOCAL_ONLY | CLOUD_PREFERRED

# Clasificador: regex + difusa primero; si no hay coincidencia clara, MiniLM.
# Bajalo con: python scripts/download_cognition_models.py
classifier_engine = "embeddings"   # embeddings | patterns
intent_model_dir = "models/intent"
fuzzy_threshold = 86.0
embedding_min_similarity = 0.55
embedding_fast_similarity = 0.80
fast_path_min_confidence = 0.75
classifier_timeout_ms = 10
max_input_chars = 2000        # mas largo se rechaza sin llamar a ningun modelo

# NIVEL 2 -- Ollama. Sin GPU dedicada, la tabla de VRAM del documento maestro
# manda Qwen3 4B en CPU con escalado agresivo a la nube.
ollama_url = "http://127.0.0.1:11434"
local_model = "qwen3:4b"
local_temperature = 0.4
local_max_tokens = 160
local_num_ctx = 4096
local_keep_alive = "-1"       # el modelo nunca se descarga de la RAM
local_timeout_s = 60.0        # en CPU, una llamada con herramientas no hace streaming
# En CPU, qwen3:4b con herramientas escribe su razonamiento como texto y tarda
# 40+ s. Apagado: las herramientas quedan para el nivel 3.
local_tools = false
local_confidence_threshold = 0.6   # debajo de esto, escala al nivel 3
confidence_logprob_weight = 0.5
confidence_stream_margin = 0.15    # holgura para hablar sin esperar a medir todo

# NIVEL 3 -- API de Claude. La clave vive en el llavero de Windows:
#   python scripts/set_secret.py anthropic_api_key
cloud_model_light = "claude-haiku-5-5"
cloud_model_standard = "claude-sonnet-5-5"
cloud_model_deep = "claude-opus-5-5"    # solo si se pide explicito
cloud_effort = "low"
cloud_max_tokens = 2048
cloud_timeout_s = 30.0
cloud_retries = 3
cloud_retry_base_s = 0.5

# Tope diario. Al alcanzarlo Jarvis avisa por voz y degrada a solo-local en vez
# de seguir cobrando. 0.50/dia son unos 15 al mes; el documento sugeria 10.
daily_budget_usd = 0.50
spend_ledger = "config/data/spend.json"

fast_step_percent = 10        # paso de volumen y brillo sin numero
spoken_max_sentences = 2      # lo que no cabe en dos frases va al chat

max_context_tokens = 8000     # mas contexto que esto, escala al nivel 3
max_chained_steps = 3         # mas pasos que esto, escala al nivel 3
local_context_tokens = 1500  # lo que ve el nivel 2; en CPU cada token cuesta
cloud_context_tokens = 32000
history_turns = 12
max_tool_iterations = 8
tool_timeout_s = 10.0

# Precios en USD por millon de tokens, para el contador de gasto.
[cognition.cloud_prices.claude-haiku-5-5]
input_per_mtok = 0.10
output_per_mtok = 0.50

[cognition.cloud_prices.claude-sonnet-5-5]
input_per_mtok = 2.00
output_per_mtok = 10.00

[cognition.cloud_prices.claude-opus-5-5]
input_per_mtok = 4.00
output_per_mtok = 20.00

# -----------------------------------------------------------------------------
# MEMORIA -- las cinco capas
# -----------------------------------------------------------------------------
[memory]
data_dir = "config/data"
embedding_model = "bge-m3"
working_turns = 20
retrieval_budget_tokens = 1500
retrieval_timeout_ms = 100    # objetivo duro de la recuperacion hibrida
consolidation_hour = 4        # hora local de la consolidacion nocturna
decay_half_life_days = 30.0
routine_promotion_threshold = 3
episodic_compression_days = 90

# -----------------------------------------------------------------------------
# HERRAMIENTAS -- servidores MCP
# -----------------------------------------------------------------------------
[tools]
enabled_servers = ["system", "files", "apps", "windows", "media"]
default_timeout_s = 30.0
parallel_calls = true
trash_retention_hours = 48    # red de seguridad para lo que Jarvis borra
screenshot_retention_minutes = 10
restart_backoff_s = 1.0

# -----------------------------------------------------------------------------
# GUARDIAN -- permisos, confirmaciones, boveda y auditoria
# -----------------------------------------------------------------------------
[guardian]
policy_file = "config/policy.toml"
confirmation_timeout_s = 15.0   # sin respuesta, una accion ROJA se cancela
undo_stack_size = 20
undo_window_s = 10.0
vault_autolock_minutes = 30
audit_retention_days = 365

# -----------------------------------------------------------------------------
# PUENTE REMOTO -- se activa en la Fase 9
# -----------------------------------------------------------------------------
[bridge]
enabled = false
# REGLA DURA: en produccion esto va a la interfaz de Tailscale, NUNCA a 0.0.0.0.
host = "127.0.0.1"
port = 8765
heartbeat_s = 15.0
max_clients = 5

# -----------------------------------------------------------------------------
# INTERFAZ -- el HUD
# -----------------------------------------------------------------------------
[ui]
layout = "full"               # full | compact | hidden
always_on_top = true
show_fps = false
particle_count = 30000        # el nivel de detalle adaptativo lo baja solo
ui_sounds = true
target_fps = 60
