[project]
name = "jarvis-core"
version = "0.1.0"
description = "Nucleo del Proyecto JARVIS: asistente personal residente controlado por voz"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "watchfiles>=0.24",
    "numpy>=1.26",
    # Fase 2: la cascada cognitiva.
    "rapidfuzz>=3.9",
    "anthropic>=2.0",
    "httpx2>=2.16",
    "keyring>=25",
    # Fase 3: la memoria. SQLite (con FTS5) viene con Python; los vectores, en LanceDB.
    "lancedb>=0.41",
    "pyarrow>=16",
    # Fase 4: el WebSocket local que alimenta al HUD.
    "websockets>=15",
]

[project.optional-dependencies]
# Los motores locales del pipeline de voz (Fase 1). Separados del nucleo porque
# pesan cientos de MB y las pruebas no los necesitan: corren con motores falsos.
voice = [
    "sounddevice>=0.5",
    "scipy>=1.13",
    "faster-whisper>=1.1",
    "openwakeword>=0.6",
    "piper-tts>=1.3",
]
# El clasificador de embeddings (MiniLM en ONNX). Sin esto la cascada funciona
# solo con patrones, que cubren todas las ordenes de forma fija.
cognition = [
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "huggingface_hub>=0.25",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["core"]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.cognition.prompts" = ["*.md"]

# ---------------------------------------------------------------------------
# RUFF -- formato y linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # advertencias de pycodestyle
    "F",    # pyflakes
    "I",    # orden de imports
    "N",    # convenciones de nombres (PEP 8)
    "UP",   # sintaxis moderna de Python
    "B",    # bugbear -- errores sutiles
    "A",    # sombreado de builtins
    "C4",   # comprensiones
    "T20",  # prohibe print() fuera de scripts
    "SIM",  # simplificaciones
    "RUF",  # reglas propias de ruff
    "ASYNC",# malas practicas en asyncio
    "ANN",  # anotaciones de tipo obligatorias
]
ignore = [
    "ANN401",  # permitimos Any explicito en la carga util del bus
    "RUF001",  # los docstrings en espanol llevan acentos y enes
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Los scripts existen para imprimir en consola.
"scripts/*" = ["T20"]
# Las pruebas no necesitan anotar cada fixture. Y ASYNC240 (escritura de
# archivos sincrona dentro de una corrutina) es justo lo que hacen a proposito
# las pruebas del vigilante de configuracion: simulan a un usuario guardando el
# TOML desde su editor, que tampoco lo hace de forma asincrona.
"tests/*" = ["ANN", "ASYNC240"]
# Los catalogos de intenciones son tablas de regex: partirlas en varias lineas
# las vuelve ilegibles. Llevan `fmt: skip` por la misma razon.
"core/jarvis/cognition/intents_*.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# MYPY -- modo estricto, sin excepciones
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# structlog no publica stubs completos para todos sus submodulos.
module = ["structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Los motores de voz no publican tipos. Solo se importan dentro de los
# adaptadores de jarvis.voice.adapters y en ninguna firma publica.
module = [
    "faster_whisper.*",
    "openwakeword.*",
    "piper.*",
    "sounddevice",
    "scipy.*",
    # El clasificador de intencion (Fase 2) usa onnxruntime, que tampoco los publica.
    "onnxruntime.*",
    # LanceDB (Fase 3) entrega sus tablas como pyarrow, que no publica tipos.
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# PYTEST
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "models: usa los modelos de voz reales; se salta sola si no estan descargados",
]
filterwarnings = ["error"]
